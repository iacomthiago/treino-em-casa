<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="robots" content="noindex">
<title>Treino em casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0d0a16; --surface:#171229; --surface-2:#211a3b; --line:#2f2752;
    --text:#f2effb; --muted:#a59ec2; --faint:#6e6790;
    --accent:#8b5cf6; --accent-2:#c4b5fd; --ok:#43d3a0; --warn:#f5c35b; --hot:#ff9a5c; --bad:#ff7a6b;
    --ph:var(--accent);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,textarea{font:inherit;color:inherit}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .app{height:100%;height:100dvh;display:flex;flex-direction:column}
  .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 22px max(16px,env(safe-area-inset-left))}
  .wrap{max-width:560px;margin:0 auto}

  /* ---------- top / nav ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
  .icon-btn:active{background:var(--surface-2)}
  nav.tabs{display:flex;border-top:1px solid var(--line);background:#120e21;
    padding:6px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;
    color:var(--faint);font-size:11.5px;font-weight:600}
  nav.tabs button.on{color:var(--accent-2)}
  nav.tabs button.on svg{stroke:var(--accent)}

  /* ---------- blocks ---------- */
  h1.pt{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2)}
  h2.sec{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);
    margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
  h2.sec small{font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:12.5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .hero{background:
      radial-gradient(120% 90% at 100% 0%,rgba(139,92,246,.42),transparent 62%),
      var(--surface);border-color:#3b2f6b}
  .hero h2{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:6px 0 4px}
  .hero p{color:var(--muted);font-size:14.5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
  .chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--accent-2);border:1px solid var(--line)}
  .chip.ok{color:var(--ok);border-color:rgba(67,211,160,.35);background:rgba(67,211,160,.1)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;
    background:var(--accent);color:#fff;font-weight:800;font-size:16.5px;margin-top:14px}
  .btn:active{filter:brightness(.9)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-weight:700}
  .btn.sm{min-height:44px;font-size:14.5px;margin-top:0;width:auto;padding:0 16px;border-radius:13px}
  .btn.ok{background:var(--ok);color:#062018}
  .links{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin-top:10px}
  .link{color:var(--accent-2);font-size:14px;font-weight:600;padding:8px 4px;text-decoration:underline;text-decoration-color:rgba(196,181,253,.35);text-underline-offset:3px}
  .note{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 14px 14px 0;padding:12px 14px;margin-bottom:12px;font-size:14.5px;color:var(--text)}
  .note b{color:var(--accent-2)}
  .note.warn{border-left-color:var(--hot);background:#21140f}
  .note.warn b{color:var(--hot)}
  .note .btn{margin-top:10px}
  .rowc{display:flex;align-items:center;gap:12px}
  .rowc .g{flex:1;min-width:0}
  .rowc .t{font-weight:700}
  .rowc .s{color:var(--muted);font-size:13.5px}
  .tick{width:36px;height:36px;border-radius:50%;background:rgba(67,211,160,.14);color:var(--ok);display:grid;place-items:center;flex:none}

  /* week strip */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wd{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:8px 2px 7px;text-align:center}
  .wd .d{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
  .wd .k{font-size:12px;font-weight:700;margin-top:3px;color:var(--muted)}
  .wd .m{height:7px;width:7px;border-radius:50%;margin:6px auto 0;background:var(--line)}
  .wd.done .m{background:var(--ok);box-shadow:0 0 8px rgba(67,211,160,.6)}
  .wd.today{border-color:var(--accent);background:var(--surface-2)}
  .wd.today .d{color:var(--accent-2)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .stat span{font-size:11.5px;color:var(--muted);font-weight:600}

  /* exercise list */
  .ex{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:0;padding-bottom:2px}
  .ex .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--accent-2);display:grid;place-items:center;font-size:12.5px;font-weight:800;margin-top:1px}
  .ex .name{font-weight:700;line-height:1.25}
  .ex .dose{color:var(--accent-2);font-weight:700;font-size:14px;margin-top:1px}
  .ex .cue{color:var(--muted);font-size:13.5px;margin-top:3px}
  .sub{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 2px}
  .sub small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
  .chead{display:flex;align-items:center;gap:10px}
  .chead .g{flex:1;min-width:0}
  .chead h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .chead p{color:var(--muted);font-size:13.5px}

  /* ladder */
  .lad{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
  .lad:last-child{border-bottom:0}
  .lad .g{flex:1;min-width:0}
  .lad .m{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .lad .cur{font-weight:700;line-height:1.25;margin-top:1px}
  .lad .last{color:var(--muted);font-size:12.5px;margin-top:2px}
  .lad .pips{display:flex;gap:4px;margin-top:6px}
  .lad .pips i{height:4px;flex:1;max-width:26px;border-radius:2px;background:var(--line)}
  .lad .pips i.on{background:var(--accent)}
  .step-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none}
  .step-btn:disabled{opacity:.3}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:99px;background:rgba(67,211,160,.14);color:var(--ok);margin-left:6px;vertical-align:1px}

  /* forms */
  .field{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .field:last-of-type{border-bottom:0}
  .field label{flex:1;font-size:14.5px}
  .field label small{display:block;color:var(--muted);font-size:12.5px}
  .field input[type=date]{width:158px!important}
  .field input.num,.field input[type=date]{width:112px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-weight:700;color-scheme:dark}
  .sw{position:relative;width:50px;height:30px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(20px)}
  table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.t th{color:var(--faint);font-weight:700;text-align:right;padding:6px 4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  table.t td{text-align:right;padding:8px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.t th:first-child,table.t td:first-child{text-align:left;color:var(--muted)}
  textarea.bk{width:100%;height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);resize:none}
  ul.g{list-style:none}
  ul.g li{position:relative;padding-left:18px;margin-bottom:10px;font-size:14.5px}
  ul.g li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  ul.g li b{color:var(--accent-2)}
  .fine{color:var(--faint);font-size:12.5px;margin:14px 0 4px}

  /* ---------- sheet / confirm / toast ---------- */
  .veil{position:fixed;inset:0;background:rgba(6,4,12,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
  .sheet{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;
    border-radius:22px 22px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom))}
  .sheet h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
  .sheet p.d{color:var(--muted);font-size:14.5px;margin-bottom:10px}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0 2px}
  .seg button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:17px}
  .seg button small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
  .seg button.on{border-color:var(--accent);background:rgba(139,92,246,.22)}
  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
  .pick:last-of-type{border-bottom:0}
  .pick .g{flex:1}
  .pick .t{font-weight:700}
  .pick .s{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:none;background:#fff;color:#1a1230;
    font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center}

  /* ---------- player ---------- */
  .player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
    padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    user-select:none;-webkit-user-select:none}
  .player[data-ph="rest"]{--ph:var(--ok)}
  .player[data-ph="prep"]{--ph:var(--warn)}
  .player[data-ph="hard"]{--ph:var(--hot)}
  .player[data-ph="easy"],.player[data-ph="stretch"]{--ph:var(--accent-2)}
  .player::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
    background:radial-gradient(60% 42% at 50% 36%,var(--ph),transparent 72%);transition:background .5s}
  .player>*{position:relative}
  .phead{display:flex;align-items:center;gap:10px;min-height:46px}
  .phead .g{flex:1;min-width:0;text-align:center}
  .phead .grp{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phead .cnt{width:44px;text-align:right;font-size:12.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
  .pbar{height:4px;border-radius:2px;background:var(--surface-2);margin:8px 0 0;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
  .pstage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2vh,18px);padding:8px 0}
  .ring-wrap{position:relative;width:min(64vw,34vh,300px);aspect-ratio:1;flex:none}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:6}
  .ring .track{stroke:var(--surface-2)}
  .ring .prog{stroke:var(--ph);stroke-linecap:round;transition:stroke .4s}
  .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-c .lab{font-size:clamp(12px,3.6vw,15px);font-weight:800;letter-spacing:.18em;color:var(--ph);transition:color .4s}
  .ring-c .time{font-size:clamp(46px,17vw,76px);font-weight:300;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
  .ptitle{font-size:clamp(22px,6.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.12}
  .psub{font-size:15px;font-weight:700;color:var(--ph)}
  .pcue{color:var(--muted);font-size:14.5px;max-width:420px}
  .target{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
  .stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:4px}
  .stepper button{width:62px;height:62px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:30px;font-weight:500;line-height:1}
  .stepper button:active{background:var(--surface-2)}
  .stepper .v{min-width:96px;font-size:clamp(60px,20vw,84px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .stepper .v.sm{font-size:40px;min-width:90px;font-weight:500}
  .hint{color:var(--faint);font-size:13px}
  .pnext{text-align:center;color:var(--faint);font-size:13px;min-height:20px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pnext b{color:var(--muted);font-weight:700}
  .pctl{display:flex;align-items:center;gap:10px}
  .pctl .side{width:56px;height:60px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
  .pctl .side:disabled{opacity:.3}
  .pctl .main{flex:1;height:60px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pctl .main.ok{background:var(--ok);color:#062018}
  .pctl .main.soft{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .pctl .main:active{filter:brightness(.9)}
  .done-wrap{flex:1;min-height:0;overflow-y:auto;padding:6px 0 10px}
  .done-hero{text-align:center;padding:18px 0 10px}
  .done-hero .big{width:76px;height:76px;border-radius:50%;background:rgba(67,211,160,.14);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
  .done-hero .big svg{width:38px;height:38px;stroke-width:2.6}
  .done-hero h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
  .done-hero p{color:var(--muted)}
  .res{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .res:last-child{border-bottom:0}
  .res b{font-variant-numeric:tabular-nums;color:var(--accent-2);white-space:nowrap}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const root = $('#root');
  const SPEED = Math.max(1, Number(new URLSearchParams(location.search).get('speed')) || 1);

  /* ================= armazenamento (fica só neste aparelho) ================= */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const KEYS = ['settings', 'levels', 'hold', 'log', 'hist', 'tests'];
  let S = Object.assign({ sound: true, vibrate: true, equip: false, start: null }, store.get('treino.settings', {}));
  let LV = store.get('treino.levels', {});
  let HOLD = store.get('treino.hold', {});
  let LOG = store.get('treino.log', {});
  let HIST = store.get('treino.hist', {});
  let TESTS = store.get('treino.tests', []);
  let SES = store.get('treino.session', null);
  const saveAll = () => {
    store.set('treino.settings', S); store.set('treino.levels', LV); store.set('treino.hold', HOLD);
    store.set('treino.log', LOG); store.set('treino.hist', HIST); store.set('treino.tests', TESTS);
  };
  const saveSes = () => (SES ? store.set('treino.session', SES) : store.del('treino.session'));

  /* ================= datas ================= */
  const pad = (n) => String(n).padStart(2, '0');
  const dkey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const parseKey = (k) => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
  const planWeek = (d) => {
    if (!S.start) return 1;
    const a = mondayOf(parseKey(S.start)), b = mondayOf(d || new Date());
    return Math.max(1, Math.round((b - a) / (7 * 864e5)) + 1);
  };
  const WD = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
  const fmtDay = (d) => d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' });
  const fmtShort = (k) => { const d = parseKey(k); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };

  /* ================= plano ================= */
  const SESS = {
    A: { name: 'Força A', tag: 'Força', short: 'A', desc: 'Agachar, empurrar, remar e glúteo' },
    B: { name: 'Força B', tag: 'Força', short: 'B', desc: 'Afundo, barra, ombro e quadril' },
    leve: { name: 'Bicicleta leve', tag: 'Bike', short: 'Bike', desc: 'Ritmo constante, esforço 5 a 6 de 10' },
    tiros: { name: 'Bicicleta com tiros', tag: 'Bike', short: 'Tiros', desc: 'Tiros de 1 min, esforço 8 a 9 de 10' },
    mob: { name: 'Mobilidade de quadril', tag: 'Mobilidade', short: 'Mob', desc: '5 alongamentos, 5 minutos' },
    livre: { name: 'Dia livre', tag: 'Livre', short: 'Livre', desc: 'Caminhada de 30 min ou só a mobilidade' }
  };
  function sessionFor(d) {
    d = d || new Date();
    const wd = (d.getDay() + 6) % 7;
    if (wd === 4) return planWeek(d) % 2 === 1 ? 'A' : 'B';
    return ['A', 'leve', 'B', 'tiros', null, 'leve', 'livre'][wd];

      '<button class="icon-btn" data-act="closePlayer" aria-label="Sair do treino">' + ic('x') + '</button>' +
      '<div class="g"><div class="grp">' + esc(s.group) + '</div></div><div class="cnt">' + (SES.i + 1) + '/' + n + '</div></div>' +
      '<div class="pbar"><i style="width:' + (100 * SES.i / n).toFixed(1) + '%"></i></div><div class="pstage">';
    if (isT) {
      h += '<div class="ring-wrap"><svg class="ring" viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="92"/>' +
        '<circle class="prog" id="prog" cx="100" cy="100" r="92" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="0"/></svg>' +
        '<div class="ring-c"><div class="lab" id="plab"></div><div class="time" id="ptime"></div></div></div>' +
        '<div class="ptitle">' + esc(s.title) + '</div>' + (s.sub ? '<div class="psub">' + esc(s.sub) + '</div>' : '') +
        (s.cue ? '<div class="pcue">' + esc(s.cue) + '</div>' : '');
      if (s.hold && SES.st === 'ready' && s.log) {
        h += '<div class="stepper"><button data-act="holdAdj" data-d="-5" aria-label="Menos 5 segundos">−</button><div class="v sm">' + s.sec + ' s</div>' +
          '<button data-act="holdAdj" data-d="5" aria-label="Mais 5 segundos">+</button></div><div class="hint">Meta: ' + esc(doseTxt(cur(s.hold))) + '</div>';
      }
    } else {
      const lh = lastHist(s.mv);
      h += '<div class="target">Meta: ' + esc(doseTxt(s)) + '</div><div class="ptitle">' + esc(s.title) + '</div><div class="pcue">' + esc(s.cue) + '</div>' +
        '<div class="stepper"><button data-act="rep" data-d="-1" aria-label="Menos uma">−</button><div class="v" id="repv">' + SES.cur + '</div>' +
        '<button data-act="rep" data-d="1" aria-label="Mais uma">+</button></div>' +
        '<div class="hint">' + (s.unit === 'rep.' ? 'repetições' : s.unit) + ' que você fez' + (s.side ? ' (' + s.side + ')' : '') +
        (lh ? ' · último treino: ' + lh.v.join(' · ') : '') + '</div>';
    }
    h += '</div><div class="pnext">' + nextTxt() + '</div><div class="pctl">' +
      '<button class="side" data-act="prev" aria-label="Voltar um passo"' + (SES.i === 0 ? ' disabled' : '') + '>' + ic('prev') + '</button>';
    if (!isT) h += '<button class="main ok" data-act="repDone">' + ic('check') + 'Feito</button>';
    else if (SES.st === 'ready') h += '<button class="main" data-act="startStep">' + ic('play') + 'Começar</button>';
    else if (SES.st === 'paused') h += '<button class="main" data-act="resumeStep">' + ic('play') + 'Continuar</button>';
    else h += '<button class="main soft" data-act="pauseStep">' + ic('pause') + 'Pausar</button>';
    return h + '<button class="side" data-act="skip" aria-label="Pular este passo">' + ic('next') + '</button></div></div>';
  }
  function doneHtml() {
    const min = Math.max(1, Math.round((SES.t1 - SES.t0) / 60000 * (SPEED > 1 ? SPEED : 1)));
    let h = '<div class="player" data-ph="rest"><div class="done-wrap"><div class="done-hero"><div class="big">' + ic('check') + '</div><h2>Treino feito</h2><p>' +
      esc(SESS[SES.type].name) + ' · ' + min + ' min · ' + streak() + (streak() === 1 ? ' dia seguido' : ' dias seguidos') + '</p></div>';
    const mvs = Object.keys(SES.vals).filter((mv) => SES.vals[mv].some((x) => x != null));
    if (mvs.length) {
      h += '<div class="card">' + mvs.map((mv) => '<div class="res"><span>' + esc(cur(mv).n) + '</span><b>' +
        SES.vals[mv].filter((x) => x != null).join(' · ') + (cur(mv).hold ? ' s' : '') + '</b></div>').join('') + '</div>';
      mvs.filter(ready).forEach((mv) => {
        h += '<div class="note"><b>' + esc(MOVES[mv].label) + ': pronto para subir.</b> Dois treinos seguidos no topo da faixa. Próximo degrau: ' +
          esc(MOVES[mv].lv[lvIdx(mv) + 1].n) + '.<button class="btn sm ghost" data-act="lv" data-mv="' + mv + '" data-d="1">Subir um degrau</button></div>';
      });
    }
    return h + '</div><div class="pctl"><button class="main" data-act="closePlayer">Concluir</button></div></div>';
  }
  function paint() {
    if (!SES || !V.player || SES.st === 'done') return;
    const s = step(); if (!s || s.k !== 't') return;
    const el = $('#player'), tm = $('#ptime'), lab = $('#plab'), pr = $('#prog'); if (!el || !tm) return;
    const st = SES.st, live = st === 'paused' ? SES.from : st;
    let total = s.sec * 1000, rem = total, label = 'PRONTO?', ph = s.phase;
    if (st === 'prep' || st === 'run') rem = Math.max(0, SES.endAt - Date.now()) * SPEED;
    else if (st === 'paused') rem = SES.rem * SPEED;
    if (live === 'prep') { total = s.prep * 1000; label = 'PREPARE'; ph = 'prep'; }
    else if (live === 'run') label = PH[s.phase] || '';
    if (st === 'paused') label = 'PAUSADO';
    if (st === 'ready') rem = total;
    el.dataset.ph = ph; lab.textContent = label; tm.textContent = fmtClock(rem);
    pr.style.strokeDashoffset = (C * (1 - Math.min(1, rem / total))).toFixed(2);
  }

  function render() {
    const tabs = [['hoje', 'Hoje'], ['plano', 'Plano'], ['prog', 'Progresso'], ['guia', 'Guia']];
    const body = V.tab === 'plano' ? viewPlano() : V.tab === 'prog' ? viewProg() : V.tab === 'guia' ? viewGuia() : viewHoje();
    const keep = $('#scroll') ? $('#scroll').scrollTop : 0;
    let h = '<div class="scroll" id="scroll"><div class="wrap">' + body + '</div></div><nav class="tabs">' +
      tabs.map((t) => '<button class="' + (V.tab === t[0] ? 'on' : '') + '" data-act="tab" data-v="' + t[0] + '">' + ic(t[0]) + t[1] + '</button>').join('') + '</nav>';
    if (V.player && SES) h += playerHtml();
    if (V.sheet) h += '<div class="veil" data-act="veil"><div class="sheet">' + sheetHtml() + '</div></div>';
    if (V.confirm) h += '<div class="veil" data-act="veil"><div class="sheet"><h3>' + esc(V.confirm.title) + '</h3><p class="d">' + esc(V.confirm.msg) + '</p>' +
      '<button class="btn" style="background:var(--bad);color:#2a0b06" data-act="confirmYes">' + esc(V.confirm.ok) + '</button>' +
      '<button class="btn ghost" style="margin-top:10px" data-act="confirmNo">Cancelar</button></div></div>';
    root.innerHTML = h;
    if ($('#scroll') && render.sameTab) $('#scroll').scrollTop = keep;
    render.sameTab = true; render.day = dkey();
    paint();
  }
  let toastT = null, toastEl = null;
  function toast(msg, keep) {
    if (!keep) render();
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 2400);
  }

  /* ================= ações ================= */
  const A = {
    tab(d) { V.tab = d.v; render.sameTab = false; render(); },
    sheet(d) { V.sheet = d.v; render(); },
    closeSheet() { V.sheet = null; V.pre = null; render(); },
    veil(d, e) { if (e.target.classList.contains('veil')) { V.sheet = null; V.pre = null; V.confirm = null; render(); } },
    begin() { S.start = dkey(); saveAll(); toast('Plano iniciado. Semana 1.'); },
    tgEquip() { S.equip = !S.equip; saveAll(); render(); },
    tgSound() { S.sound = !S.sound; saveAll(); if (S.sound) { unlockAudio(); playNow(sChime); } render(); },
    tgVib() { S.vibrate = !S.vibrate; saveAll(); buzz(80); render(); },
    go(d) {
      unlockAudio();
      if (d.v === 'A' || d.v === 'B') { V.pre = { type: d.v, rounds: defRounds(planWeek()) }; V.sheet = 'pre'; render(); }
      else startSession(d.v);
    },
    rounds(d) { V.pre.rounds = Number(d.v); render(); },
    startPre() { unlockAudio(); startSession(V.pre.type, V.pre.rounds); },
    resume() { V.player = true; unlockAudio(); keepAwake(); render(); },
    discard() { V.confirm = { title: 'Descartar o treino em andamento?', msg: 'O que você já registrou nesta sessão será perdido.', ok: 'Descartar', fn() { SES = null; saveSes(); } }; render(); },
    mark(d) { const k = dkey(), L = LOG[k] = LOG[k] || {}; (L.done = L.done || {})[d.v] = 1; saveAll(); toast('Marcado como feito.'); },
    unmark(d) { const L = LOG[dkey()]; if (L && L.done) delete L.done[d.v]; saveAll(); render(); },
    walk() { (LOG[dkey()] = LOG[dkey()] || {}).walk = 1; saveAll(); toast('Caminhada registrada.'); },
    lv(d) {
      const mv = d.mv, max = mv === 'tiros' ? TIROS.length - 1 : MOVES[mv].lv.length - 1;
      LV[mv] = Math.max(0, Math.min(max, (LV[mv] || 0) + Number(d.d)));
      saveAll(); toast(mv === 'tiros' ? TIROS[LV[mv]].txt : MOVES[mv].label + ': ' + MOVES[mv].lv[LV[mv]].n);
    },
    saveTest() {
      const val = (id) => { const v = parseFloat(String(($('#t_' + id) || {}).value || '').replace(',', '.')); return isFinite(v) && v > 0 ? v : null; };
      const t = { d: dkey(), flex: val('flex'), barra: val('barra'), latE: val('latE'), latD: val('latD'), bike: val('bike') };
      if (!t.flex && !t.barra && !t.latE && !t.latD && !t.bike) return toast('Preencha pelo menos um teste.', true);
      const at = TESTS.findIndex((x) => x.d === t.d);
      if (at >= 0) { Object.keys(t).forEach((k) => { if (t[k] == null) t[k] = TESTS[at][k]; }); TESTS[at] = t; } else TESTS.push(t);
      saveAll(); toast('Teste salvo.');
    },
    copyBk() {
      const ta = $('#bk'); if (!ta) return;
      const ok = () => toast('Copiado.', true);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, () => { ta.select(); toast('Selecionado: copie manualmente.', true); });
      else { ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Selecionado: copie manualmente.', true); } }
    },
    restoreBk() {
      let data; try { data = JSON.parse(($('#bk') || {}).value || ''); } catch (e) { return toast('Texto inválido.', true); }
      if (!data || typeof data !== 'object' || !KEYS.some((k) => data[k])) return toast('Texto inválido.', true);
      V.confirm = { title: 'Restaurar esta cópia?', msg: 'Os registros atuais deste aparelho serão substituídos.', ok: 'Restaurar', fn() {
        KEYS.forEach((k) => { if (data[k] != null) store.set('treino.' + k, data[k]); });
        location.reload();
      } }; render();
    },
    wipe() { V.confirm = { title: 'Apagar todos os registros?', msg: 'Treinos, degraus e testes deste aparelho serão apagados. Não dá para desfazer.', ok: 'Apagar tudo', fn() {
      KEYS.concat(['session']).forEach((k) => store.del('treino.' + k)); location.reload();
    } }; render(); },
    confirmYes() { const c = V.confirm; V.confirm = null; V.sheet = null; c.fn(); render(); },
    confirmNo() { V.confirm = null; render(); },

    closePlayer() { closePlayer(); },
    startStep() { startTimed(); },
    pauseStep() { pauseSes(); },
    resumeStep() { resumeSes(); },
    prev() { if (SES.i > 0) enterStep(SES.i - 1, false); },
    skip() { unlockAudio(); enterStep(SES.i + 1, true); },
    rep(d) { SES.cur = Math.max(0, Math.min(99, SES.cur + Number(d.d))); saveSes(); const el = $('#repv'); if (el) el.textContent = SES.cur; },
    repDone() { const s = step(); unlockAudio(); keepAwake(); logVal(s.mv, s.r, SES.cur); buzz(50); enterStep(SES.i + 1, true); },
    holdAdj(d) {
      const s = step(), mv = s.hold, sec = Math.max(5, Math.min(180, s.sec + Number(d.d)));
      HOLD[mv + ':' + lvKey(mv)] = sec; saveAll();
      for (let i = SES.i; i < SES.steps.length; i++) if (SES.steps[i].hold === mv) SES.steps[i].sec = sec;
      saveSes(); render();
    }
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.act]; if (fn) fn(el.dataset, e);
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.chg === 'start') { S.start = e.target.value || null; saveAll(); render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (V.player && SES && SES.st !== 'done') keepAwake();
    if (V.player && timed()) { unlockAudio(); scheduleSounds(); }
    tick();
    if (render.day !== dkey() && !V.player && !V.sheet) render(); else paint();
  });

  /* ================= início ================= */
  if (SES && (SES.st === 'done' || SES.date !== dkey())) { SES = null; saveSes(); }
  if (SES && timed()) { SES.rem = Math.max(0, SES.endAt - Date.now()); SES.from = SES.st; SES.st = 'paused'; saveSes(); }
  setInterval(tick, 200);
  render();
})();
</script>
</body>
</html>
